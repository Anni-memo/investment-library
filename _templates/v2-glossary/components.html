  spoke.html / hub.html に必要なものをコピーして使う。

<!-- ===== .definition-box — 定義ボックス（AI引用の核心） ===== -->
<style>
.definition-box{
  background:linear-gradient(180deg,#fbf5e8 0%,#f5ede0 100%);
  border:1px solid rgba(139,105,20,.3);
  border-left:4px solid var(--gold2);
  padding:28px 26px 24px;margin:28px 0;
  position:relative;
}
.definition-box::before{
  content:'';position:absolute;top:0;left:-4px;right:0;height:1px;
  background:linear-gradient(90deg,var(--gold3),transparent);
}
.definition-label{font-family:var(--mono);font-size:.56rem;letter-spacing:.28em;color:var(--gold);margin-bottom:10px;}
.definition-term{font-family:var(--serif);font-size:1.25rem;font-weight:600;color:var(--ink);margin-bottom:14px;letter-spacing:.02em;}
.definition-body{font-size:.92rem;line-height:1.85;color:var(--ink2);margin-bottom:20px;}
.definition-body strong{color:var(--ink);background:linear-gradient(transparent 60%,rgba(240,204,85,.45) 60%);padding:0 2px;}
.definition-formula{
  background:var(--parch2);padding:16px 18px;margin:16px 0;
  border:1px dashed rgba(139,105,20,.4);
}
.formula-label{font-family:var(--mono);font-size:.5rem;letter-spacing:.24em;color:var(--gold);margin-bottom:8px;}
.formula-display{font-family:var(--mono);font-size:.95rem;color:var(--ink);letter-spacing:.04em;margin-bottom:6px;}
.formula-note{font-size:.72rem;color:var(--ink3);line-height:1.6;}
.definition-meta{display:flex;flex-wrap:wrap;gap:16px 24px;padding-top:16px;border-top:1px solid rgba(139,105,20,.2);}
.meta-pair{display:flex;flex-direction:column;gap:2px;}
.meta-key{font-family:var(--mono);font-size:.48rem;letter-spacing:.2em;color:var(--ink3);text-transform:uppercase;}
.meta-val{font-family:var(--jp);font-size:.8rem;color:var(--ink);font-weight:500;}
@media(max-width:600px){.definition-meta{gap:12px 16px}.definition-term{font-size:1.1rem}}
</style>

<!-- ===== .reading-guide — 読み方ガイド ===== -->
<style>
.reading-guide{
  background:var(--parch);border:1px solid rgba(139,105,20,.25);
  padding:24px 26px;margin:32px 0;position:relative;
}
.reading-guide-label{font-family:var(--mono);font-size:.56rem;letter-spacing:.28em;color:var(--gold);margin-bottom:8px;}
.reading-guide-title{font-family:var(--serif);font-size:1.1rem;font-weight:600;color:var(--ink);margin-bottom:18px;}
.reading-guide-list{list-style:none;counter-reset:axis;margin:0;padding:0;}
.reading-guide-list li{
  counter-increment:axis;
  position:relative;padding:14px 0 14px 44px;
  border-top:1px solid rgba(139,105,20,.18);
  font-size:.88rem;line-height:1.75;color:var(--ink2);
}
.reading-guide-list li:first-child{border-top:none}
.reading-guide-list li::before{
  content:counter(axis,decimal-leading-zero);
  position:absolute;left:0;top:16px;
  font-family:var(--mono);font-size:.62rem;color:var(--gold2);
  letter-spacing:.06em;font-weight:500;
}
.reading-guide-list strong{color:var(--ink);font-weight:600;background:linear-gradient(transparent 60%,rgba(240,204,85,.4) 60%);padding:0 2px;}
</style>


<!-- ===== .related-metrics — 関連指標グリッド ===== -->
<style>
.related-metrics{margin:36px 0 24px;}
.related-metrics-label{font-family:var(--mono);font-size:.56rem;letter-spacing:.28em;color:var(--gold);margin-bottom:8px;}
.related-metrics-title{font-family:var(--serif);font-size:1.1rem;font-weight:600;color:var(--ink);margin-bottom:16px;}
.related-metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.related-metric{
  display:flex;flex-direction:column;gap:6px;
  padding:16px 18px;background:var(--parch2);
  border:1px solid rgba(139,105,20,.22);
  text-decoration:none;color:var(--ink);
  transition:background .2s,border-color .2s,transform .15s;
}
.related-metric:hover{background:var(--parch3);border-color:var(--gold2);transform:translateY(-1px);}
.related-metric-code{font-family:var(--mono);font-size:.56rem;letter-spacing:.24em;color:var(--gold);}
.related-metric-name{font-family:var(--serif);font-size:1rem;font-weight:600;color:var(--ink);}
.related-metric-desc{font-size:.74rem;line-height:1.6;color:var(--ink3);}
</style>


<!-- ===== .toc-item（ジャンル別TOC用・母艦） ===== -->
<!-- v2-textbook の .toc-item を流用。違いは .toc-num を .toc-code に置換 -->
<style>
.toc-code{font-family:var(--mono);font-size:.7rem;color:var(--gold);letter-spacing:.08em;font-weight:600;}
</style>


<!-- ===== .genre-card（母艦用・ジャンル導入カード） ===== -->
<style>
.genre-card{
  padding:20px 22px;background:var(--parch2);
  border-left:3px solid var(--gold2);margin-bottom:14px;
}
.genre-card-label{font-family:var(--mono);font-size:.56rem;letter-spacing:.28em;color:var(--gold);margin-bottom:6px;}
.genre-card-title{font-family:var(--serif);font-size:1.05rem;font-weight:600;color:var(--ink);margin-bottom:6px;}
.genre-card-desc{font-size:.78rem;line-height:1.7;color:var(--ink2);}
</style>


<!-- ===== .chart-placeholder（データ可視化の枠） ===== -->
<style>
.chart-placeholder{
  background:linear-gradient(180deg,#fbf5e8 0%,#f0e6d0 100%);
  border:1px dashed rgba(139,105,20,.4);
  padding:32px 24px;text-align:center;
  font-family:var(--mono);font-size:.72rem;color:var(--ink3);
  margin:20px 0;letter-spacing:.06em;
}
.chart-placeholder-label{font-size:.52rem;letter-spacing:.24em;color:var(--gold);margin-bottom:8px;}
</style>
